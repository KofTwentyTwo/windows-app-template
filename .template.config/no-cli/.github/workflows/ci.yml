# .NET build, test, coverage, and format gates (K22-CI-01, K22-CI-02, K22-TEST-10).
# Produces the required contexts `ci / build-test`, `ci / format`, and `ci / ui-tests`.
# The coverage gate holds the UI-free core at 100% line coverage.
name: ci

on:
  pull_request:
  push:
    branches: [main]

  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  installed-updates:
    name: installed-updates
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Velopack and verify installed channels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'installed-smoke-tools'
          dotnet tool install vpk --version 1.2.161 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Test-InstalledUpdates.ps1 -VpkPath (Join-Path $tools 'vpk.exe')
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-update-results
          path: |
            artifacts/installed-smoke-*/*.json
            artifacts/installed-smoke-*/*.log
            artifacts/installed-smoke-*/*.trx
          retention-days: 7
  ci:
    uses: KofTwentyTwo/standards/.github/workflows/dotnet.yml@fdf5ed029603c938615a32b1beca3628b8787945 # v0.1.2
    permissions:
      contents: read # check out, build, and test; nothing is written
    with:
      solution: Kof22App.slnx
      platform: x64
      coverage-packages: Kof22App.Core
      test-projects: |
        tests/Kof22App.Core.Tests
      ui-test-projects: |
        tests/Kof22App.UiTests
