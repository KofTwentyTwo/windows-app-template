# NuGet template package release for a KofTwentyTwo repository (K22-CI-30, K22-REL-*).
# Copy to .github/workflows/release.yml. Pushing a protected v* tag builds, tests,
# packs, generates SBOMs, attests, and publishes the GitHub release through the shared
# reusable workflow, then pushes the packages to nuget.org.
#
# nuget.org trusted publishing (one-time owner setup, no API key stored anywhere):
#   nuget.org → your profile → Trusted Publishing → Add policy:
#     Repository Owner: KofTwentyTwo
#     Repository:       windows-app-template
#     Workflow File:    release.yml        (THIS file's name, not the reusable workflow's)
#     Environment:      release
#   then set the repository variable NUGET_USER to your nuget.org profile name.
# The publish job must stay in this file: nuget.org checks that the OIDC token's
# job_workflow_ref belongs to this repository, which a job inside the reusable
# workflow (in KofTwentyTwo/standards) can never satisfy.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout main and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require NuGet publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"

  gates:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: verify
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  codeql:
    needs: verify
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  scripts:
    needs: verify
    uses: ./.github/workflows/scripts.yml
    permissions:
      contents: read

  release:
    needs: [verify, gates, security, codeql, scripts]
    uses: KofTwentyTwo/standards/.github/workflows/release-nuget.yml@70b555bd5658273090769991bfc4c9b6681dde18 # v1.2.1
    permissions:
      contents: write      # create and publish the GitHub release
      id-token: write      # sign attestations
      attestations: write  # store attestations
    with:
      solution: templates/KofTwentyTwo.Templates.WindowsApp.csproj
      platform: x64

  publish:
    name: publish (nuget.org)
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      attestations: read # verify the attestations before pushing
      id-token: write    # trusted publishing token exchange
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # Push only bytes that the shared release workflow built and attested.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for package in packages/*.nupkg; do
            gh attestation verify "$package" --repo "$REPOSITORY" --signer-repo KofTwentyTwo/standards
          done

      - name: NuGet login (OIDC to a one-hour API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
