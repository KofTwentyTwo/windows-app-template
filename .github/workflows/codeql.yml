# CodeQL static analysis (K22-CI-22): security-extended queries for C# (a manual x64
# build of the solution) and for the workflows themselves, blocking high severity.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

  workflow_call:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    uses: KofTwentyTwo/standards/.github/workflows/codeql.yml@96cbdf208a15c9c524676bd15ff9e323228a952b # v1.1.1
    permissions:
      contents: read         # check out the code
      security-events: write # upload CodeQL results to code scanning
    with:
      languages: '["csharp", "actions", "javascript-typescript"]'
      build-mode: manual
      build-command: dotnet build Kof22App.slnx -p:Platform=x64
      runs-on: windows-latest
      setup-dotnet: true
