# CodeQL static analysis (K22-CI-22): security-extended queries for C# (a manual x64
# build of the solution) and for the workflows themselves, blocking high severity.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    uses: KofTwentyTwo/standards/.github/workflows/codeql.yml@ae3df7af77e5a97df231a9f53be9d8ed785ddce5 # main (pre-release)
    permissions:
      contents: read         # check out the code
      security-events: write # upload CodeQL results to code scanning
    with:
      languages: '["csharp", "actions"]'
      build-mode: manual
      build-command: dotnet build Kof22App.slnx -p:Platform=x64
      runs-on: windows-latest
      setup-dotnet: true
